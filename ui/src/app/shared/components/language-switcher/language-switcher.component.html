<button (click)="langService.toggleLanguage()" class="relative inline-flex items-center gap-2
         px-3 h-10 rounded-lg
         text-gray-700 dark:text-gray-400
         hover:bg-gray-100 dark:hover:bg-gray-800
         transition-all duration-300 ease-out
         hover:scale-105 active:scale-95
         overflow-hidden group" [attr.aria-label]="langService.isEnglish() ? 'Switch to Arabic' : 'Switch to English'">
    <!-- Globe Icon -->
    <lucide-icon [img]="globIcon" [size]="20" class="transition-transform duration-500 ease-in-out
           group-hover:rotate-12
           rtl:-scale-x-100"></lucide-icon>

    <!-- Text Wrapper -->
    <span class="relative w-[60px] h-5 overflow-hidden">
        <!-- English -->
        <span class="absolute inset-0 flex items-center justify-start
             font-medium text-sm
             transition-all duration-500 ease-in-out" [ngClass]="{
        'opacity-100 translate-x-0': langService.isEnglish(),
        'opacity-0 -translate-x-6 rtl:translate-x-6': !langService.isEnglish()
      }">
            English
        </span>

        <!-- Arabic -->
        <span class="absolute inset-0 flex items-center justify-start
             font-medium text-sm
             transition-all duration-500 ease-in-out" [ngClass]="{
        'opacity-100 translate-x-0': !langService.isEnglish(),
        'opacity-0 translate-x-6 rtl:-translate-x-6': langService.isEnglish()
      }">
            عربي
        </span>
    </span>

    <!-- Click ripple -->
    <span class="absolute inset-0 rounded-lg bg-brand-500/20
           scale-0 group-active:scale-100
           transition-transform duration-300"></span>
</button>
