@if (loading()) {
  <div class="fixed inset-0 backdrop-blur-md flex items-center justify-center z-50">
    <div class="flex flex-col items-center gap-4">
      <div class="w-16 h-16 border-4 border-gray-500/30 border-t-gray-700 rounded-full animate-spin"></div>
      <span class="text-gray-700 text-sm font-medium tracking-widest uppercase animate-pulse">Loading</span>
    </div>
  </div>
  }
